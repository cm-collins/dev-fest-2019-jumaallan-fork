// This file contains all the dependencies shared across the modules, to ease setup and management
dependencies {

    // androidX and Material
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Android Jetpack
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    // lifecycle-extensions is deprecated, use individual lifecycle components instead
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.0'
    // Anko is deprecated, consider removing or replacing with standard Android APIs
    // implementation "org.jetbrains.anko:anko-common:0.10.4"

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Logging - debug builds
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.facebook.stetho:stetho:1.6.0'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.13'

    // Images
    implementation 'io.coil-kt:coil:2.5.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // DI
    implementation 'org.koin:koin-android:3.5.0'
    implementation 'org.koin:koin-androidx-viewmodel:3.5.0'
}